services:
  orders_api:
    build:
      context: ../../
      dockerfile: backend/orders_api/Dockerfile
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@tenant_db:5432/launchpad_tenant
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME}
      LOG_LEVEL: info
      DEFAULT_TENANT_SCHEMA: acme
    depends_on:
      tenant_db:
        condition: service_healthy
    networks:
      - launchpad_net

networks:
  launchpad_net:
    name: launchpad_net
    external: true