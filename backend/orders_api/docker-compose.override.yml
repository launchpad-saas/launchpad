services:
  orders_api:
    build:
      target: development
    ports:
      - "8003:8000"
    volumes:
      - ./:/app/backend/orders_api
      - ../../packages/launchpad_shared:/app/packages/launchpad_shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      LOG_LEVEL: debug

  orders_api_db:
    ports:
      - "5435:5432"
