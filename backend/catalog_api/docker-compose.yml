services:
  catalog_api:
    build:
      context: ../../
      dockerfile: backend/catalog_api/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/launchpad_tenant
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME}
      DEFAULT_TENANT_SCHEMA: acme
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - launchpad_net
networks:
  launchpad_net:
    name: launchpad_net
    external: true