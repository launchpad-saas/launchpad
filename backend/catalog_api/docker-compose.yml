services:
  catalog_api:
    build:
      context: ../../
      dockerfile: backend/catalog_api/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@catalog_api_db:5432/launchpad_catalog
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME}
    depends_on:
      catalog_api_db:
        condition: service_healthy
    networks:
      - launchpad_net

  catalog_api_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launchpad_catalog
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - catalog_api_db_data:/var/lib/postgresql/data
      - ../../database/init-scripts/catalog:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d launchpad_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - launchpad_net

networks:
  launchpad_net:
    name: launchpad_net

volumes:
  catalog_api_db_data: