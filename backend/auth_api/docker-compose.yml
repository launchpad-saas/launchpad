services:
  auth_api:
    build:
      context: ../../
      dockerfile: backend/auth_api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/launchpad_auth
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - launchpad_net

networks:
  launchpad_net:
    name: launchpad_net
    external: true