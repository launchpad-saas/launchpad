services:
  auth_api:
    build:
      target: development
    volumes:
      - ./:/app/backend/auth_api
      - ../../packages/launchpad_shared:/app/packages/launchpad_shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      LOG_LEVEL: debug

  auth_api_db:
    ports:
      - "5441:5432"