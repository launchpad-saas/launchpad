name: Validate LaunchPad Specifications

on:
  push:
    paths:
      - "specs/**"
      - ".github/workflows/validate-specs.yml"
  pull_request:
    paths:
      - "specs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-specs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate feature specifications
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          specs = list(Path("specs/features").glob("*.md"))

          if not specs:
              print("No feature specifications found.")
              sys.exit(1)

          required_sections = [
              "Problem",
              "Objective",
              "Scope",
              "Functional Requirements",
              "Acceptance Criteria",
              "Story Breakdown",
          ]

          failed = False

          for spec in specs:
              content = spec.read_text(encoding="utf-8").lower()

              missing = [
                  section for section in required_sections
                  if f"## {section}".lower() not in content
              ]

              if missing:
                  print(f"FAILED: {spec}")
                  print(f"Missing sections: {', '.join(missing)}")
                  failed = True
              else:
                  print(f"PASSED: {spec}")

          if failed:
              sys.exit(1)

          print("All feature specifications are valid.")
          PY
